name: Hexy-Plexy

options:
  bundleIdPrefix: ergo.sum.coge
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.2"

configs:
  Debug: debug
  Release: release

project:
  settings:
    base:
      SWIFT_VERSION: "5.9"
      ONLY_ACTIVE_ARCH: "NO"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0"

targets:
  Hexy-Plexy:
    type: application
    platform: macOS

    sources:
      - path: .
        excludes:
          - .git
          - .github
          - .build
          - .vscode
          - Build
          - docs
          - Hexy-Plexy.xcodeproj
          - Assets.xcassets
          - Info.plist
          - Hexy-Plexy.entitlements

    resources:
      - path: Assets.xcassets

    settings:
      base:
        PRODUCT_NAME: "Hexy-Plexy"
        PRODUCT_BUNDLE_IDENTIFIER: ergo.sum.coge.hexy-plexy
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ARCHS: "$(ARCHS_STANDARD)"
        INFOPLIST_FILE: Info.plist
        ENABLE_HARDENED_RUNTIME: YES

    entitlements:
      path: Hexy-Plexy.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        
