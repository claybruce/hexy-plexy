name: Hexy-Plexy

options:
  bundleIdPrefix: ergo.sum.coge
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  deploymentTarget:
    macOS: "11.0"
  xcodeVersion: "15.2"

configs:
  Debug: debug
  Release: release

project:
  settings:
    base:
      SWIFT_VERSION: "5.9"
      ONLY_ACTIVE_ARCH: "NO"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0"

targets:
  Hexy-Plexy:
    type: application
    platform: macOS

    sources:
      - path: Sources

    resources:
      - path: Resources

    settings:
      base:
        PRODUCT_NAME: "Hexy-Plexy"
        PRODUCT_BUNDLE_IDENTIFIER: ergo.sum.coge.hexy-plexy
        MACOSX_DEPLOYMENT_TARGET: "11.0"
        ARCHS: "$(ARCHS_STANDARD)"
        INFOPLIST_FILE: Supporting/Info.plist
        ENABLE_HARDENED_RUNTIME: YES

    entitlements:
      path: Supporting/Hexy-Plexy.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true

  Hexy-Plexy-Sierra:
    type: application
    platform: macOS

    sources:
      - path: Sources

    resources:
      - path: Resources

    settings:
      base:
        PRODUCT_NAME: "Hexy-Plexy"
        PRODUCT_BUNDLE_IDENTIFIER: ergo.sum.coge.hexy-plexy.sierra
        MACOSX_DEPLOYMENT_TARGET: "10.13"
        ARCHS: x86_64
        VALID_ARCHS: x86_64
        INFOPLIST_FILE: Supporting/Info.plist
        ENABLE_HARDENED_RUNTIME: YES

    entitlements:
      path: Supporting/Hexy-Plexy.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
